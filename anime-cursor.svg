<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
    <defs>
        <filter id="animeGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ccff00" flood-opacity="0.95"/>
            <feDropShadow dx="0" dy="1" stdDeviation="6" flood-color="#73ff00" flood-opacity="0.6"/>
        </filter>
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ccff00"/>
            <stop offset="100%" stop-color="#55dd00"/>
        </linearGradient>
        <linearGradient id="darkEdge" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1c1c22"/>
            <stop offset="100%" stop-color="#08080a"/>
        </linearGradient>
    </defs>
    <!-- Anime Cyber Kunai Pointer -->
    <g filter="url(#animeGlow)" transform="translate(6, 6) rotate(-20 26 26)">
        <!-- Outer Dark Facet -->
        <path d="M26 2 L38 24 L28 28 L28 42 L24 42 L24 28 L14 24 Z" fill="url(#darkEdge)" stroke="#ccff00" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Inner Energy Core -->
        <path d="M26 4 L35 22 L26 25 L17 22 Z" fill="url(#bladeGrad)"/>
        <!-- Center Spine -->
        <line x1="26" y1="5" x2="26" y2="25" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
        <!-- Pommel Ring -->
        <circle cx="26" cy="47" r="5" fill="none" stroke="#ccff00" stroke-width="2"/>
        <circle cx="26" cy="47" r="2.5" fill="#ccff00"/>
        <!-- Anime Accent Spark -->
        <polygon points="36,8 38,5 40,8 43,10 40,12 38,15 36,12 33,10" fill="#ffffff" opacity="0.9"/>
    </g>
</svg>
